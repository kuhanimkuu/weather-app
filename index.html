<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Weather App</h1>
    <div class="display">
        <div class="form-group">
            <form>
            <label for="location">Location</label>
            <input type="text" name="location" id="location" class="location" placeholder="Enter location" required>
            <button id="submit">Submit</button>    
            </form>
        </div>
            <div class="display-elements">
                <h2 class="city" id="city"></h2>
                
                    <div class="weather">
                        <div class="humidity" id="humidity"></div>
                        <div class="feel" id="feel"></div>
                        <div class="temp" id="temp"></div>
                        <div class="temp_max" id="temp_max"></div>
                        <div class="temp_min" id="temp_min"></div>
                        <div class="pressure" id="pressure"></div>
                    </div>
                    <div class="speed" id="speed"></div>
                    
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
